# destinations/<name>.yml — file path (minus extension) is the destination name
description: Where these events go and why
tags: [web] # must exist in eventvisor.config.js `tags`

# module name registered in the app's createEventvisor({ modules: [...] })
# official transports: console, ga4, gtm, segment-browser, sentry-browser,
# datadog-browser, amplitude-browser, mixpanel-browser, newrelic-browser
transport: console

# --- optional fields, delete what you don't need ---

# conditions:                    # which events reach this destination
#   - source: eventName
#     operator: in
#     value: [page_view, order_completed]

# sample:                        # ingest only a consistent bucket of users
#   by: attributes.userId
#   percentage: 10

# transforms:                    # build the exact body the vendor expects
#   - type: set
#     value: {}
#   - source: eventName
#     type: set
#     target: event
#   - source: payload
#     type: set
#     target: properties
#   - source: attributes
#     type: set
#     target: context

# archived: true
