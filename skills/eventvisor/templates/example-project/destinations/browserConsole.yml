description: Consented analytics printed to the console
tags: [all, web]
transport: console
conditions:
  - attribute: consentAnalytics
    operator: equals
    value: true
transforms:
  - type: set
    value: {}
  - source: eventName
    type: set
    target: name
  - source: payload
    type: set
    target: properties
  - source: attributes
    type: set
    target: context
