description: A customer completed an order
tags: [all, checkout, backend]
type: object
properties:
  orderId:
    type: string
  total:
    type: number
    minimum: 0
  orderTotal:
    type: number
  itemCount:
    type: integer
    minimum: 1
required: [orderId, total, itemCount]
requiredAttributes: [userId, currency]
transforms:
  - type: rename
    targetMap:
      total: orderTotal
