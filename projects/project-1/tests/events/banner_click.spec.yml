event: banner_click

assertions:
  # no transformations needed
  - description: "event should be valid"
    matrix:
      screenWidth: [100, 320]
    track:
      bannerId: "123"
      screenWidth: ${{screenWidth}}
    expectedToBeValid: true
    expectedEvent:
      bannerId: "123"
      screenWidth: ${{screenWidth}}

  # with transformations
  - description: "event should be valid (with transformations)"
    withLookups:
      browser.screen.width: 200
    track:
      bannerId: "234"
    expectedToBeValid: true
    expectedEvent:
      bannerId: "234"
      screenWidth: 200
      screen:
        width: 200
